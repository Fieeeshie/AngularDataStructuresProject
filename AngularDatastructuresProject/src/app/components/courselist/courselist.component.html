<div class="container mt-4">
  <h2 class="text-center mb-4">Course List</h2>
  
  <table class="table">
    <thead>
      <tr>
        <th>Id</th>
        <th>Course Name</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let course of courses">
        <td>{{ course.id }}</td>
        <td>{{ course.courseName }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Course</h3>
  <form (ngSubmit)="addCourse()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="coursename">Course Name:</label>
      <input type="text" [(ngModel)]="courseName" name="coursename" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Course</button>
  </form>
</div>
