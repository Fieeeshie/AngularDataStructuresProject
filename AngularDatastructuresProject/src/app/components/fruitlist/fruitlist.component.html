<div class="container mt-4">
  <h2 class="text-center mb-4">Fruit List</h2>
  
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Number</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let fruit of fruits">
        <td>{{ fruit.id }}</td>
        <td>{{ fruit.name }}</td>
        <td>{{ fruit.number }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Fruit</h3>
  <form (ngSubmit)="addFruit()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" [(ngModel)]="name" name="name" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="number">Number:</label>
      <input type="number" [(ngModel)]="number" name="number" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Fruit</button>
  </form>
</div>
