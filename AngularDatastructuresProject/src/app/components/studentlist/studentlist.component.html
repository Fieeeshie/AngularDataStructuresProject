<div class="container mt-4">
  <h2 class="text-center mb-4">Student List</h2>
  
  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Age</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let student of students">
        <td>{{ student.id }}</td>
        <td>{{ student.name }}</td>
        <td>{{ student.age }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Student</h3>
  <form (ngSubmit)="addStudent()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" [(ngModel)]="name" name="name" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="age">Age:</label>
      <input type="number" [(ngModel)]="age" name="age" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Student</button>
  </form>
</div>
