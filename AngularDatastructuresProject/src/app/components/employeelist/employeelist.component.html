<div class="container mt-4">
  <h2 class="text-center mb-4">Employee List</h2>

  <table class="table">
    <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Job</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let employee of employee">
        <td>{{ employee.id }}</td>
        <td>{{ employee.name }}</td>
        <td>{{ employee.job }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Employee</h3>
  <form (ngSubmit)="addEmployee()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" [(ngModel)]="name" name="name" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="job">Job:</label>
      <input type="text" [(ngModel)]="job" name="job" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Employee</button>
  </form>
</div>
