<div class="container mt-4">
  <h2 class="text-center mb-4">Movie List</h2>
  
  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>Movie</th>
        <th>Year Release</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let movie of movies">
        <td>{{ movie.id }}</td>
        <td>{{ movie.movie }}</td>
        <td>{{ movie.yearReleased }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Movie</h3>
  <form (ngSubmit)="addMovie()" class="mt-3">
    <div class="form-group">
      <label for="id">Id</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="movie">Movie</label>
      <input type="text" [(ngModel)]="movie" name="movie" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="yearReleased">Year Release</label>
      <input type="text" [(ngModel)]="yearReleased" name="yearReleased" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Movie</button>
  </form>
</div>
