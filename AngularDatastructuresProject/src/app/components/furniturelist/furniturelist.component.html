<div class="container mt-4">
  <h2 class="text-center mb-4">Furniture List</h2>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Id</th>
        <th>Furniture</th>
        <th>Wood Type</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let furniture of furnitureList">
        <td>{{ furniture.id }}</td>
        <td>{{ furniture.furniturename }}</td>
        <td>{{ furniture.woodtype }}</td>
        <td>₱{{ furniture.price | number: '1.2-2' }}</td> 
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Furniture</h3>
  <form (ngSubmit)="addFurniture()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="furniturename">Furniture Name:</label>
      <input type="text" [(ngModel)]="furniturename" name="furniturename" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="woodtype">Wood Type:</label>
      <input type="text" [(ngModel)]="woodtype" name="woodtype" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="price">Price:</label>
      <input type="number" [(ngModel)]="price" name="price" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Furniture</button>
  </form>
</div>
