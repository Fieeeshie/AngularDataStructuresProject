<div class="container mt-4">
  <h2 class="text-center mb-4">Presentation List</h2>
  
  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>Title</th>
        <th>Software</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let presentation of presentations">
        <td>{{ presentation.id }}</td>
        <td>{{ presentation.title }}</td>
        <td>{{ presentation.softwareTool }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Presentation</h3>
  <form (ngSubmit)="addPresentation()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="title">Title:</label>
      <input type="text" [(ngModel)]="title" name="title" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="softwareTool">Software Tool:</label>
      <input type="text" [(ngModel)]="softwareTool" name="softwareTool" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Presentation</button>
  </form>
</div>
