<div class="container mt-4">
  <h2 class="text-center mb-4">Laptop List</h2>

  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>Laptop</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let laptop of laptopList">
        <td>{{ laptop.id }}</td>
        <td>{{ laptop.laptop }}</td>
        <td>{{ laptop.price | currency }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Laptop</h3>
  <form (ngSubmit)="addLaptop()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="laptop">Laptop:</label>
      <input type="text" [(ngModel)]="laptop" name="laptop" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="price">Price:</label>
      <input type="number" [(ngModel)]="price" name="price" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Laptop</button>
  </form>
</div>
