<div class="container mt-4">
  <h2 class="text-center mb-4">Classroom List</h2>

  <table class="table">
    <thead>
      <tr>
        <th>Id</th>
        <th>Room</th>
        <th>Floor</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let classroom of classroomList">
        <td>{{ classroom.id }}</td>
        <td>{{ classroom.room }}</td>
        <td>{{ classroom.floor }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Classroom</h3>
  <form (ngSubmit)="addClassroom()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="room">Room:</label>
      <input type="text" [(ngModel)]="room" name="room" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="floor">Floor:</label>
      <input type="number" [(ngModel)]="floor" name="floor" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Classroom</button>
  </form>
</div>
