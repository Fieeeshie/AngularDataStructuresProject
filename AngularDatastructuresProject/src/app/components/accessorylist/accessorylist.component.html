<div class="container mt-4">
  <h2 class="text-center mb-4">Accessory List</h2>

  <table class="table">
    <thead>
      <tr>
        <th>Id</th>
        <th>Accessory</th>
        <th>Brand</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let accessory of accessoryList">
        <td>{{ accessory.id }}</td>
        <td>{{ accessory.accessory }}</td>
        <td>{{ accessory.brand }}</td>
        <td>₱{{ accessory.price | number: '1.2-2' }}</td> 
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Accessory</h3>
  <form (ngSubmit)="addAccessory()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="accessory">Accessory:</label>
      <input type="text" [(ngModel)]="accessory" name="accessory" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="brand">Brand:</label>
      <input type="text" [(ngModel)]="brand" name="brand" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="price">Price:</label>
      <input type="number" [(ngModel)]="price" name="price" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Accessory</button>
  </form>
</div>
