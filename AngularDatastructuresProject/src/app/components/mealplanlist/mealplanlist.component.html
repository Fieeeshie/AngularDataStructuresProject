<div class="container mt-4">
  <h2 class="text-center mb-4">Meal Plan List</h2>

  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>Food</th>
        <th>Day</th>
        <th>Meal Type</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let mealPlan of mealPlans">
        <td>{{ mealPlan.id }}</td>
        <td>{{ mealPlan.foodName }}</td>
        <td>{{ mealPlan.day }}</td>
        <td>{{ mealPlan.mealType }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Meal Plan</h3>
  <form (ngSubmit)="addMealPlan()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="foodName">Food Name:</label>
      <input type="text" [(ngModel)]="foodName" name="foodName" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="day">Day:</label>
      <input type="text" [(ngModel)]="day" name="day" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="mealType">Meal Type:</label>
      <input type="text" [(ngModel)]="mealType" name="mealType" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Meal Plan</button>
  </form>
</div>
