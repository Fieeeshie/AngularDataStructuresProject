<div class="container mt-4">
  <h2 class="text-center mb-4">Painting List</h2>

  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>Art</th>
        <th>Artist</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let painting of paintings">
        <td>{{ painting.id }}</td>
        <td>{{ painting.artname }}</td>
        <td>{{ painting.artist }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Painting</h3>
  <form (ngSubmit)="addPainting()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="artname">Art Name:</label>
      <input type="text" [(ngModel)]="artname" name="artname" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="artist">Artist:</label>
      <input type="text" [(ngModel)]="artist" name="artist" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Painting</button>
  </form>
</div>
