<div class="container mt-4">
  <h2 class="text-center mb-4">Lecture List</h2>

  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>Subject</th>
        <th>Lecture</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of lectureList">
        <td>{{ item.id }}</td>
        <td>{{ item.subject }}</td>
        <td>{{ item.lecture }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Lecture Item</h3>
  <form (ngSubmit)="addLectureItem()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="subject">Subject:</label>
      <input type="text" [(ngModel)]="subject" name="subject" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="lecture">Lecture:</label>
      <input type="text" [(ngModel)]="lecture" name="lecture" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Lecture Item</button>
  </form>
</div>
