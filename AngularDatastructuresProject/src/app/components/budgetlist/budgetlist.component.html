<div class="container mt-4">
  <h2 class="text-center mb-4">Budget List</h2>
  
  <table class="table">
    <thead>
      <tr>
        <th>Id</th>
        <th>Amount (PHP)</th>
        <th>Day</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let budget of budgets">
        <td>{{ budget.id }}</td>
        <td>₱{{ budget.amount }}</td>
        <td>{{ budget.day }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Budget</h3>
  <form (ngSubmit)="addBudget()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required/>
    </div>
    <div class="form-group">
      <label for="amount">Amount:</label>
      <input type="number" [(ngModel)]="amount" name="amount" class="form-control" required/>
    </div>
    <div class="form-group">
      <label for="day">Day:</label>
      <input type="text" [(ngModel)]="day" name="day" class="form-control" required/>
    </div>
    <button type="submit" class="btn btn-primary">Add Budget</button>
  </form>
</div>
