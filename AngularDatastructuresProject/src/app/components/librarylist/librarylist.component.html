<div class="container mt-4">
  <h2 class="text-center mb-4">Library List</h2>

  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>Library</th>
        <th>Opening</th>
        <th>Closing</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let library of libraries">
        <td>{{ library.id }}</td>
        <td>{{ library.libraryName }}</td>
        <td>{{ library.opening }}</td>
        <td>{{ library.closing }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Library</h3>
  <form (ngSubmit)="addLibrary()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="libraryName">Library Name:</label>
      <input type="text" [(ngModel)]="libraryName" name="libraryName" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="opening">Opening:</label>
      <input type="text" [(ngModel)]="opening" name="opening" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="closing">Closing:</label>
      <input type="text" [(ngModel)]="closing" name="closing" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Library</button>
  </form>
</div>
