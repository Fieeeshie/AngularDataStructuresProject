<div class="container mt-4">
  <h2 class="text-center mb-4">Developer List</h2>

  <table class="table">
    <thead>
      <tr>
        <th>Id</th>
        <th>Software Tool</th>
        <th>Version</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let developer of developers">
        <td>{{ developer.id }}</td>
        <td>{{ developer.softwareTool }}</td>
        <td>{{ developer.version }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Developer</h3>
  <form (ngSubmit)="addDeveloper()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="softwareTool">Software Tool:</label>
      <input type="text" [(ngModel)]="softwareTool" name="softwareTool" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="version">Version:</label>
      <input type="text" [(ngModel)]="version" name="version" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add</button>
  </form>
</div>
