<div class="container mt-4">
  <h2 class="text-center mb-4">Mobile App List</h2>

  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>App</th>
        <th>Descriptions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let appItem of mobileAppList">
        <td>{{ appItem.id }}</td>
        <td>{{ appItem.app }}</td>
        <td>{{ appItem.descriptions }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Mobile App</h3>
  <form (ngSubmit)="addMobileApp()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="app">App:</label>
      <input type="text" [(ngModel)]="app" name="app" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="descriptions">Descriptions:</label>
      <input type="text" [(ngModel)]="descriptions" name="descriptions" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Mobile App</button>
  </form>
</div>
