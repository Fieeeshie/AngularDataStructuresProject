<div class="container mt-4">
  <h2 class="text-center mb-4">Laptop Specification List</h2>

  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>Laptop</th>
        <th>Specifications</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let laptopSpec of laptopSpecificationList">
        <td>{{ laptopSpec.id }}</td>
        <td>{{ laptopSpec.laptop }}</td>
        <td>{{ laptopSpec.specs }}</td>
        <td>{{ laptopSpec.price | currency: 'PHP' }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Laptop Specification</h3>
  <form (ngSubmit)="addLaptopSpecification()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="laptop">Laptop:</label>
      <input type="text" [(ngModel)]="laptop" name="laptop" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="specs">Specifications:</label>
      <input type="text" [(ngModel)]="specs" name="specs" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="price">Price:</label>
      <input type="number" [(ngModel)]="price" name="price" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Laptop Specification</button>
  </form>
</div>
