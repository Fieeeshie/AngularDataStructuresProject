<div class="container mt-4">
  <h2 class="text-center mb-4">Country List</h2>
  
  <table class="table">
    <thead>
      <tr>
        <th>Id</th>
        <th>Country Name</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let country of countries">
        <td>{{ country.id }}</td>
        <td>{{ country.name }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Country</h3>
  <form (ngSubmit)="addCountry()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="name">Country Name:</label>
      <input type="text" [(ngModel)]="name" name="name" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Country</button>
  </form>
</div>
