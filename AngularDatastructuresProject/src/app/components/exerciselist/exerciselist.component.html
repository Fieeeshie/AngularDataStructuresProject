<div class="container mt-4">
  <h2 class="text-center mb-4">Exercise List</h2>
  
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Id</th>
        <th>Exercise</th>
        <th>Description</th>
        <th>Target Muscle</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let exercise of exercises">
        <td>{{ exercise.id }}</td>
        <td>{{ exercise.exerciseName }}</td>
        <td>{{ exercise.description }}</td>
        <td>{{ exercise.targetMuscle }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Exercise</h3>
  <form (ngSubmit)="addExercise()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="exerciseName">Exercise Name:</label>
      <input type="text" [(ngModel)]="exerciseName" name="exerciseName" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="description">Description:</label>
      <input type="text" [(ngModel)]="description" name="description" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="targetMuscle">Target Muscle:</label>
      <input type="text" [(ngModel)]="targetMuscle" name="targetMuscle" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Exercise</button>
  </form>
</div>
