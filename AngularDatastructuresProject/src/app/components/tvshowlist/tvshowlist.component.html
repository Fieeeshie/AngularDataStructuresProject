<div class="container mt-4">
  <h2 class="text-center mb-4">TV Show List</h2>

  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>Show Name</th>
        <th>Channel</th>
        <th>Parental Guidance</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let show of tvShowList">
        <td>{{ show.id }}</td>
        <td>{{ show.showname }}</td>
        <td>{{ show.channel }}</td>
        <td>{{ show.parentalGuidance }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add TV Show</h3>
  <form (ngSubmit)="addShow()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="showname">Show Name:</label>
      <input type="text" [(ngModel)]="showname" name="showname" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="channel">Channel:</label>
      <input type="text" [(ngModel)]="channel" name="channel" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="parentalGuidance">Parental Guidance:</label>
      <input type="text" [(ngModel)]="parentalGuidance" name="parentalGuidance" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Show</button>
  </form>
</div>
