<div class="container mt-4">
  <h2 class="text-center mb-4">Phone Contact List</h2>

  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>Contact</th>
        <th>Number</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let contact of contacts">
        <td>{{ contact.id }}</td>
        <td>{{ contact.contactName }}</td>
        <td>{{ contact.number }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Contact</h3>
  <form (ngSubmit)="addContact()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="contactName">Contact Name:</label>
      <input type="text" [(ngModel)]="contactName" name="contactName" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="number">Number:</label>
      <input type="text" [(ngModel)]="number" name="number" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Contact</button>
  </form>
</div>
