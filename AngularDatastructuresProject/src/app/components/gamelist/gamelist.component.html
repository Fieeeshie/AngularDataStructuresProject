<div class="container mt-4">
  <h2 class="text-center mb-4">Game List</h2>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Id</th>
        <th>Game</th>
        <th>Genre</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let game of games">
        <td>{{ game.id }}</td>
        <td>{{ game.game }}</td>
        <td>{{ game.genre }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Game</h3>
  <form (ngSubmit)="addGame()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="game">Game:</label>
      <input type="text" [(ngModel)]="game" name="game" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="genre">Genre:</label>
      <input type="text" [(ngModel)]="genre" name="genre" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Game</button>
  </form>
</div>
