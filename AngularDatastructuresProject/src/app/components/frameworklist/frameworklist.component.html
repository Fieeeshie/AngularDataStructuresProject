<div class="container mt-4">
  <h2 class="text-center mb-4">Framework List</h2>
  
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Id</th>
        <th>Framework</th>
        <th>Version</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let framework of frameworks">
        <td>{{ framework.id }}</td>
        <td>{{ framework.framework }}</td>
        <td>{{ framework.version }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Framework</h3>
  <form (ngSubmit)="addFramework()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="framework">Framework:</label>
      <input type="text" [(ngModel)]="framework" name="framework" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="version">Version:</label>
      <input type="text" [(ngModel)]="version" name="version" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Framework</button>
  </form>
</div>
