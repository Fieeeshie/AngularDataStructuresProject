<div class="container mt-4">
  <h2 class="text-center mb-4">Vegetable List</h2>
  
  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>Vegetable</th>
        <th>Quantity</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let vegetable of vegetables">
        <td>{{ vegetable.id }}</td>
        <td>{{ vegetable.vegetable }}</td>
        <td>{{ vegetable.quantity }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Vegetable</h3>
  <form (ngSubmit)="addVegetable()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="vegetable">Vegetable:</label>
      <input type="text" [(ngModel)]="vegetable" name="vegetable" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="quantity">Quantity:</label>
      <input type="number" [(ngModel)]="quantity" name="quantity" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Vegetable</button>
  </form>
</div>
