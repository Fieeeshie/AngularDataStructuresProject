<div class="container mt-4">
  <h2 class="text-center mb-4">Computer Hardware List</h2>

  <table class="table">
    <thead>
      <tr>
        <th>Id</th>
        <th>Hardware</th>
        <th>Descriptions</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let hardwareItem of computerHardwareList">
        <td>{{ hardwareItem.id }}</td>
        <td>{{ hardwareItem.hardware }}</td>
        <td>{{ hardwareItem.descriptions }}</td>
        <td>{{ hardwareItem.price | currency:'PHP':'symbol' }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Computer Hardware</h3>
  <form (ngSubmit)="addComputerHardware()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="hardware">Hardware:</label>
      <input type="text" [(ngModel)]="hardware" name="hardware" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="descriptions">Descriptions:</label>
      <input type="text" [(ngModel)]="descriptions" name="descriptions" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="price">Price:</label>
      <input type="number" [(ngModel)]="price" name="price" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Computer Hardware</button>
  </form>
</div>
