<div class="container mt-4">
  <h2 class="text-center mb-4">Destination List</h2>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Id</th>
        <th>Destination</th>
        <th>Location</th>
        <th>Entrance Price</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let destination of destinationList">
        <td>{{ destination.id }}</td>
        <td>{{ destination.destination }}</td>
        <td>{{ destination.location }}</td>
        <td>₱{{ destination.entrancePrice.toFixed(2) }}</td> <!-- Fixed two decimal points -->
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Destination</h3>
  <form (ngSubmit)="addDestination()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="destination">Destination:</label>
      <input type="text" [(ngModel)]="destination" name="destination" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="location">Location:</label>
      <input type="text" [(ngModel)]="location" name="location" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="entrancePrice">Entrance Price:</label>
      <input type="number" [(ngModel)]="entrancePrice" name="entrancePrice" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Destination</button>
  </form>
</div>
