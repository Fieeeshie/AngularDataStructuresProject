<div class="container mt-4">
  <h2 class="text-center mb-4">Programming Language List</h2>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Id</th>
        <th>Language</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let language of languages">
        <td>{{ language.id }}</td>
        <td>{{ language.language }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Programming Language</h3>
  <form (ngSubmit)="addLanguage()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="language">Language:</label>
      <input type="text" [(ngModel)]="language" name="language" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Language</button>
  </form>
</div>
