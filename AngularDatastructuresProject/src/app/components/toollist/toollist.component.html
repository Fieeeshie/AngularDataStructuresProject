<div class="container mt-4">
  <h2 class="text-center mb-4">Tool List</h2>
  
  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>Tool</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let tool of tools">
        <td>{{ tool.id }}</td>
        <td>{{ tool.tool }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Tool</h3>
  <form (ngSubmit)="addTool()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="tool">Tool:</label>
      <input type="text" [(ngModel)]="tool" name="tool" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Tool</button>
  </form>
</div>
