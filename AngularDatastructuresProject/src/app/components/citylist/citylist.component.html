<div class="container mt-4">
  <h2 class="text-center mb-4">City List</h2>

  <table class="table">
    <thead>
      <tr>
        <th>Id</th>
        <th>City</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let city of cities">
        <td>{{ city.id }}</td>
        <td>{{ city.city }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add City</h3>
  <form (ngSubmit)="addCity()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="city">City:</label>
      <input type="text" [(ngModel)]="city" name="city" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add City</button>
  </form>
</div>
