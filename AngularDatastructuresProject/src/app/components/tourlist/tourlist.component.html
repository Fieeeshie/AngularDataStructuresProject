<div class="container mt-4">
  <h2 class="text-center mb-4">Tour List</h2>
  
  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>Tour</th>
        <th>Location</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let tour of tours">
        <td>{{ tour.id }}</td>
        <td>{{ tour.tour }}</td>
        <td>{{ tour.location }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Tour</h3>
  <form (ngSubmit)="addTour()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="tour">Tour:</label>
      <input type="text" [(ngModel)]="tour" name="tour" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="location">Location:</label>
      <input type="text" [(ngModel)]="location" name="location" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Tour</button>
  </form>
</div>
