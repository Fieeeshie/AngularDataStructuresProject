<div class="container mt-4">
  <h2 class="text-center mb-4">Video List</h2>

  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>Video</th>
        <th>Descriptions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let videoItem of videoList">
        <td>{{ videoItem.id }}</td>
        <td>{{ videoItem.video }}</td>
        <td>{{ videoItem.descriptions }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Video</h3>
  <form (ngSubmit)="addVideo()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="video">Video:</label>
      <input type="text" [(ngModel)]="video" name="video" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="descriptions">Descriptions:</label>
      <input type="text" [(ngModel)]="descriptions" name="descriptions" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Video</button>
  </form>
</div>
