<div class="container mt-4">
  <h2 class="text-center mb-4">Food Menu</h2>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Id</th>
        <th>Food</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of menu">
        <td>{{ item.id }}</td>
        <td>{{ item.food }}</td>
        <td>₱{{ item.price | number: '1.2-2' }}</td> 
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Food</h3>
  <form (ngSubmit)="addFood()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="food">Food:</label>
      <input type="text" [(ngModel)]="food" name="food" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="price">Price:</label>
      <input type="number" [(ngModel)]="price" name="price" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Food</button>
  </form>
</div>
