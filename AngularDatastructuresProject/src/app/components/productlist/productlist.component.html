<div class="container mt-4">
  <h2 class="text-center mb-4">Product List</h2>
  
  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Manufactured</th>
        <th>Expiration</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products">
        <td>{{ product.id }}</td>
        <td>{{ product.productName }}</td>
        <td>{{ product.manufacture }}</td>
        <td>{{ product.expiration }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Product</h3>
  <form (ngSubmit)="addProduct()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="productName">Product Name:</label>
      <input type="text" [(ngModel)]="productName" name="productName" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="manufacture">Manufactured:</label>
      <input type="number" [(ngModel)]="manufacture" name="manufacture" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="expiration">Expiration:</label>
      <input type="number" [(ngModel)]="expiration" name="expiration" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Product</button>
  </form>
</div>
