<div class="container mt-4">
  <h2 class="text-center mb-4">Podcast List</h2>
  
  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>Cast</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let podcast of podcasts">
        <td>{{ podcast.id }}</td>
        <td>{{ podcast.contentCreator }}</td>
        <td>{{ podcast.description }}</td>
      </tr>
    </tbody>
  </table>
  
  <h3 class="mt-4">Add Podcast</h3>
  <form (ngSubmit)="addPodcast()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="contentCreator">Content Creator:</label>
      <input type="text" [(ngModel)]="contentCreator" name="contentCreator" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="description">Description:</label>
      <textarea [(ngModel)]="description" name="description" class="form-control" rows="3" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Add Podcast</button>
  </form>
</div>
