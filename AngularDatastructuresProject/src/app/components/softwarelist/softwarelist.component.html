<div class="container mt-4">
  <h2 class="text-center mb-4">Software List</h2>

  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>Software</th>
        <th>Version</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let software of softwareList">
        <td>{{ software.id }}</td>
        <td>{{ software.software }}</td>
        <td>{{ software.version }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Software</h3>
  <form (ngSubmit)="addSoftware()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="software">Software:</label>
      <input type="text" [(ngModel)]="software" name="software" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="version">Version:</label>
      <input type="text" [(ngModel)]="version" name="version" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Software</button>
  </form>
</div>
