<div class="container mt-4">
  <h2 class="text-center mb-4">Subject List</h2>
  
  <table class="table table-striped table-bordered">
    <thead class="thead-light">
      <tr>
        <th>Id</th>
        <th>Subject</th>
        <th>Schedule</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let subject of subjects">
        <td>{{ subject.id }}</td>
        <td>{{ subject.subject }}</td>
        <td>{{ subject.schedule }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Subject</h3>
  <form (ngSubmit)="addSubject()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="subject">Subject:</label>
      <input type="text" [(ngModel)]="subject" name="subject" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="schedule">Schedule:</label>
      <input type="text" [(ngModel)]="schedule" name="schedule" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Subject</button>
  </form>
</div>
