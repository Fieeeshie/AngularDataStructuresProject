<div class="container mt-4">
  <h2 class="text-center mb-4">Grocery List</h2>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Id</th>
        <th>Product</th>
        <th>Quantity</th>
        <th>Price</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of groceryList">
        <td>{{ item.id }}</td>
        <td>{{ item.product }}</td>
        <td>{{ item.quantity }}</td>
        <td>₱{{ item.price | number: '1.2-2' }}</td>
        <td>₱{{ item.total | number: '1.2-2' }}</td>
      </tr>
    </tbody>
  </table>

  <h3 class="mt-4">Add Grocery Item</h3>
  <form (ngSubmit)="addGrocery()" class="mt-3">
    <div class="form-group">
      <label for="id">Id:</label>
      <input type="text" [(ngModel)]="id" name="id" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="product">Product:</label>
      <input type="text" [(ngModel)]="product" name="product" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="quantity">Quantity:</label>
      <input type="number" [(ngModel)]="quantity" name="quantity" class="form-control" required />
    </div>
    <div class="form-group">
      <label for="price">Price:</label>
      <input type="number" [(ngModel)]="price" name="price" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Grocery Item</button>
  </form>
</div>
